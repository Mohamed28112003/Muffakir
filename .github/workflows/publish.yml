name: Publish to PyPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Check whether version is already on PyPI
        id: version
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          name = project["name"]
          version = project["version"]
          url = f"https://pypi.org/pypi/{quote(name, safe='')}/{quote(version, safe='')}/json"
          request = Request(url, headers={"Accept": "application/json"})
          try:
              with urlopen(request, timeout=30):
                  publish = False
          except HTTPError as error:
              if error.code != 404:
                  raise
              publish = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"publish={str(publish).lower()}", file=output)
          print(f"{name} {version}: {'new release' if publish else 'already on PyPI; skipping'}")
          PY
      - name: Install build tools
        if: steps.version.outputs.publish == 'true'
        run: python -m pip install build twine
      - name: Build distributions
        if: steps.version.outputs.publish == 'true'
        run: python -m build
      - name: Check distribution metadata
        if: steps.version.outputs.publish == 'true'
        run: python -m twine check dist/*
      - name: Upload distributions
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/Muffakir/
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v5
        with:
          name: release-dists
          path: dist/
      - name: Check PyPI token is configured
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: test -n "$PYPI_API_TOKEN" || { echo "Missing PYPI_API_TOKEN GitHub Actions secret"; exit 1; }
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
