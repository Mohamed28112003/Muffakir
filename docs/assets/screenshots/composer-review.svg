<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">ComposerUI review and launch</title><desc id="desc">A sanitized review screen showing a validated Muffakir Composer search configuration.</desc>
  <rect width="1440" height="820" fill="#0a0e14"/><rect width="1440" height="58" fill="#10141a" stroke="#414752"/>
  <text x="30" y="35" fill="#dfe2eb" font-family="monospace" font-size="16" font-weight="700">MUFFAKIR<tspan fill="#58a6ff">//</tspan>COMPOSER</text><text x="1165" y="35" fill="#7bdb80" font-family="monospace" font-size="11">● Composer Engine Active</text>
  <rect x="30" y="90" width="1380" height="45" rx="6" fill="#00315c" stroke="#58a6ff"/><text x="52" y="118" fill="#a2c9ff" font-family="Arial" font-size="14" font-weight="700">Configuration validated</text><text x="222" y="118" fill="#c0c7d4" font-family="Arial" font-size="12">Your search is ready to launch. Credentials remain local and redacted from saved configuration.</text>
  <text x="30" y="180" fill="#dfe2eb" font-family="Arial" font-size="24" font-weight="700">Review &amp; launch</text><text x="30" y="204" fill="#8b919d" font-family="Arial" font-size="12">Confirm the search plan before Composer creates a checkpoint and begins evaluation.</text>
  <g transform="translate(30 235)"><rect width="680" height="230" rx="8" fill="#1c2026" stroke="#414752"/><text x="22" y="32" fill="#dfe2eb" font-family="Arial" font-size="15" font-weight="700">Pipeline summary</text><g font-family="monospace" font-size="12"><text x="22" y="73" fill="#8b919d">MODE</text><text x="205" y="73" fill="#dfe2eb">full_rag</text><text x="22" y="106" fill="#8b919d">KNOWLEDGE SOURCE</text><text x="205" y="106" fill="#dfe2eb">local documents</text><text x="22" y="139" fill="#8b919d">QUERY TRANSFORM</text><text x="205" y="139" fill="#a2c9ff">rewrite</text><text x="22" y="172" fill="#8b919d">RERANKER</text><text x="205" y="172" fill="#a2c9ff">cross_encoder · bge-reranker-v2-m3</text><text x="22" y="205" fill="#8b919d">EVALUATION DATASET</text><text x="205" y="205" fill="#dfe2eb">Arabic policy questions · 24 samples</text></g></g>
  <g transform="translate(730 235)"><rect width="680" height="230" rx="8" fill="#1c2026" stroke="#414752"/><text x="22" y="32" fill="#dfe2eb" font-family="Arial" font-size="15" font-weight="700">Scoring plan</text><g font-family="monospace" font-size="12"><text x="22" y="73" fill="#8b919d">RETRIEVAL</text><text x="205" y="73" fill="#dfe2eb">recall · mrr</text><text x="22" y="106" fill="#8b919d">GENERATION</text><text x="205" y="106" fill="#dfe2eb">faithfulness · LLM Judge Rating</text><text x="22" y="139" fill="#8b919d">TRIALS</text><text x="205" y="139" fill="#a2c9ff">8 resolved combinations</text><text x="22" y="172" fill="#8b919d">CHECKPOINT</text><text x="205" y="172" fill="#dfe2eb">enabled · resumable</text><text x="22" y="205" fill="#8b919d">TRACE CAPTURE</text><text x="205" y="205" fill="#7bdb80">enabled</text></g></g>
  <g transform="translate(30 495)"><rect width="1380" height="190" rx="8" fill="#1c2026" stroke="#414752"/><text x="22" y="33" fill="#dfe2eb" font-family="Arial" font-size="15" font-weight="700">Resolved search space</text><g font-family="monospace" font-size="12"><text x="22" y="72" fill="#8b919d">retrieval</text><text x="210" y="72" fill="#dfe2eb">similarity_search, hybrid</text><text x="22" y="103" fill="#8b919d">reranking</text><text x="210" y="103" fill="#dfe2eb">none, cross_encoder</text><text x="22" y="134" fill="#8b919d">reranking_model</text><text x="210" y="134" fill="#a2c9ff">BAAI/bge-reranker-v2-m3</text><text x="22" y="165" fill="#8b919d">k</text><text x="210" y="165" fill="#dfe2eb">3, 5</text></g><rect x="1090" y="107" width="250" height="50" rx="5" fill="#58a6ff"/><text x="1153" y="139" fill="#00315c" font-family="Arial" font-size="15" font-weight="700">Launch search</text></g>
  <text x="30" y="758" fill="#8b919d" font-family="Arial" font-size="11">Sanitized ComposerUI visual • review configuration before any trial is launched</text>
</svg>
