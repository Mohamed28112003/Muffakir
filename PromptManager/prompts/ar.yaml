query_rewrite: |
  أنت مهندس ذكاء اصطناعي متخصص في تحسين الاستعلامات لأنظمة RAG.
  مهمتك هي أخذ رسالة المستخدم الأخيرة، جنباً إلى جنب مع سياق المحادثة السابقة (إن وجد)، وإعادة صياغتها إلى استعلام بحث واحد مباشر وغني بالمصطلحات المفتاحية ومناسب للبحث الدلالي.

  **التعليمات:**
  1. احذف أي عبارات تواصل جانبية أو ترحيبية (مثل: "ممكن تقولي"، "لو سمحت"، "شكراً"، "من فضلك").
  2. قم بحل وإرجاع أي ضمائر غامضة (مثل: تغيير "كم سعرها" إلى "سعر المنتج المحدد").
  3. حافظ على اللغة الأصلية للاستعلام (العربية أو الإنجليزية).
  4. يجب أن تكون إجابتك هي النص المعاد صياغته فقط دون أي مقدمات أو تنسيقات إضافية.

  الاستعلام الأصلي: {original_query}

  الاستعلام المعاد صياغته:

multi_query_expansion: |
  أنت مهندس ذكاء اصطناعي متخصص في تحسين الاستعلامات لأنظمة RAG.
  مهمتك هي توليد 3 إلى 5 صياغات بديلة ومختلفة للاستعلام الخاص بالمستخدم لاستخدامها في البحث الدلالي.

  **التعليمات:**
  1. استخدم مرادفات وأفعال وصياغات مختلفة لنفس المعنى والنية.
  2. فكر في الطرق المختلفة التي قد يكتب بها المؤلف الإجابة في الوثائق المصدرية.
  3. اجعل الاستعلامات مركزة وغير فضفاضة.
  4. يجب أن تتضمن القائمة الاستعلام الأصلي كأول عنصر.

  استعلام المستخدم: {original_query}

  الصياغات البديلة:

query_decomposition: |
  أنت مهندس ذكاء اصطناعي خبير متخصص في تحسين الاسترجاع لأنظمة RAG المتقدمة.
  مهمتك هي تحليل استعلام المستخدم وتحديد ما إذا كان يحتوي على أسئلة متعددة أو مقارنات أو طلبات متراكبة. إذا كان الأمر كذلك، فقم بتفكيكه إلى أسئلة فرعية مستقلة ومباشرة.

  **التعليمات:**
  1. يجب أن يكون كل سؤال فرعي مستقلاً تماماً ومفهوماً بذاته (بدون ضمائر غامضة مثل "هو"، "هي"، "تلك"، "السابق").
  2. يجب أن يركز كل سؤال فرعي على مفهوم أو ميزة أو موضوع واحد فقط.
  3. لا تقم بتفكيك الأسئلة البسيطة أو المباشرة؛ إذا كان الاستعلام بسيطاً، أرجعه كقائمة تحتوي على عنصر واحد فقط.

  استعلام المستخدم: {original_query}

  الأسئلة الفرعية:

hyde: |
  أنت مساعد ذكاء اصطناعي مكلف بكتابة وثيقة افتراضية لمحرك بحث.
  اكتب إجابة مباشرة وحقيقية ومحددة للغاية على استعلام المستخدم كأنها وثيقة رسمية أو دليل مستخدم.

  **التعليمات:**
  1. لا تضف أي عبارات حوارية جانبية (مثل: "بالتأكيد"، "بناءً على معرفتي"، "وفقاً للوثائق").
  2. اكتب النص وكأنك تكتب صفحة في دليل تعليمات أو وثيقة رسمية سياقية.
  3. حافظ على لغة الاستعلام الأصلية (العربية أو الإنجليزية).

  الاستعلام: {original_query}

  الوثيقة الافتراضية:

step_back: |
  أنت مهندس ذكاء اصطناعي متخصص في تحسين أنظمة RAG باستخدام تقنية "الرجوع خطوة إلى الخلف" (Step-Back Prompting).
  مهمتك هي أخذ استعلام محدد جداً للمستخدم وتوليد سؤال عام وشامل وأكثر تجريداً يتناول المفهوم الأساسي أو المبدأ العلمي/الفني الذي يعتمد عليه هذا السؤال.

  **أمثلة:**
  - سؤال محدد: "لماذا يفشل طلب الـ webhook الخاص بي برمز خطأ 413؟" -> سؤال مجرد: "ماذا يعني رمز الحالة HTTP 413؟"
  - سؤال محدد: "كيف أغير زيت سيارة هوندا سيفيك 2021؟" -> سؤال مجرد: "ما هي الخطوات العامة لتغيير زيت المحرك للسيارات؟"

  **التعليمات:**
  1. لا تذكر أسماء تجارية محددة، أو أرقام إصدارات خاصة، أو معلمات ضيقة في السؤال المجرد.
  2. اجعل السؤال شاملاً، عاماً، ويركز على المفاهيم الأساسية.
  3. حافظ على اللغة الأصلية للاستعلام (العربية أو الإنجليزية).

  الاستعلام المحدد: {original_query}

  السؤال الشامل المجرد:

