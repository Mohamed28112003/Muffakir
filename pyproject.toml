[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Muffakir"
version = "0.3.0"
description = "Multilingual RAG experimentation and evaluation toolkit"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mohamed" }]
dependencies = [
  "langchain-core>=0.3.33,<2.0.0",
  "pydantic>=2.11,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
rag = [
  "langchain>=0.3.17,<2.0.0",
  "langchain-community>=0.3.16,<1.0.0",
  "langchain-text-splitters>=0.3.5,<2.0.0",
  "requests>=2.32,<3.0",
  "tqdm>=4.67,<5.0",
]
local = ["sentence-transformers>=3.4.1,<4.0.0"]
chroma = [
  "chromadb>=0.6.3,<0.7.0",
  "langchain-chroma>=0.2.1,<2.0.0",
  "posthog>=2.4.0,<3.0.0",
]
openai = ["langchain-openai>=0.3.3,<2.0.0"]
