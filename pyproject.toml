[project.scripts]
muffakir = "Muffakir.cli:main"

[project.urls]
Repository = "https://github.com/Mohamed28112003/Muffakir"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
exclude = ["examples", "examples.*", "build", "build.*"]

[tool.setuptools.package-data]
PromptManager = ["prompts/*.yaml"]
ComposerUI = ["frontend/*.html", "frontend/static/*.png", "frontend/static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
